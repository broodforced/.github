    <path d="M220 290 C 231 302, 281 302, 292 290"/>
    <path d="M232 328 C 240 340, 272 340, 280 328"/>
    <path d="M244 360 C 249 368, 263 368, 268 360"/>
  </g>

  <!-- thorax -->
  <ellipse cx="256" cy="198" rx="52" ry="30" fill="#7ee787"/>
  <ellipse cx="256" cy="198" rx="34" ry="18" fill="#2ea043" opacity="0.55"/>

  <!-- head -->
  <ellipse cx="256" cy="138" rx="42" ry="30" fill="#7ee787"/>
  <circle cx="224" cy="130" r="11" fill="#0a120f"/>
  <circle cx="288" cy="130" r="11" fill="#0a120f"/>
  <circle cx="228" cy="126" r="3" fill="#e6edf3"/>
  <circle cx="292" cy="126" r="3" fill="#e6edf3"/>

  <!-- antennae -->
  <g stroke="#7ee787" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M236 112 C 226 90, 214 78, 196 70"/>
    <path d="M276 112 C 286 90, 298 78, 316 70"/>
