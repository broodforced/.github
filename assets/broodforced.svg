      <stop offset="0" stop-color="#12241c"/>
      <stop offset="1" stop-color="#0a120f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- wings -->
  <g fill="#7ee787" opacity="0.30">
    <path d="M184 210 C 128 198, 76 150, 58 94 C 92 90, 122 112, 150 148 C 128 170, 116 198, 176 216 Z"/>
    <path d="M328 210 C 384 198, 436 150, 454 94 C 420 90, 390 112, 362 148 C 384 170, 396 198, 336 216 Z"/>
  </g>
  <!-- wing veins -->
  <g stroke="#e6edf3" stroke-width="3" fill="none" opacity="0.32" stroke-linecap="round">
    <path d="M176 190 C 140 176, 104 150, 88 116"/>
    <path d="M164 200 C 132 190, 104 170, 90 142"/>
    <path d="M336 190 C 372 176, 408 150, 424 116"/>
    <path d="M348 200 C 380 190, 408 170, 422 142"/>
  </g>

  <!-- abdomen -->
  <path d="M186 216 C 198 252, 210 330, 256 398 C 302 330, 314 252, 326 216 Z" fill="#7ee787"/>
  <g stroke="#0a120f" stroke-width="4" fill="none" stroke-linecap="round">
